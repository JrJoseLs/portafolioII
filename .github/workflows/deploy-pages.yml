# Compila, prueba y publica el portafolio en GitHub Pages en cada push a main.
# Requisito (una sola vez): Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Si Source queda en "Deploy from a branch", GitHub publica el README con Jekyll
# y el paso "deploy" falla con un error 404.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm run test:ci

      - name: Build for GitHub Pages
        run: npm run build:gh-pages

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/j-port

  deploy:
    # Los pull requests solo se compilan y prueban; se publica al hacer merge en main.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
